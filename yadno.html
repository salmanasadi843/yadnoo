<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>یادنو — دفترچه یادداشت (نسخه ۲۳)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7719aa">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--paper:#faf9fc;--paper-line:#eae5f0;--line:#eae5f0;--ink:#32263d;--ink-soft:#6c6076;--gold:#8a3cba;--sage:#4eae68;--danger:#A83E32;--panel:#fff;--radius:13px;--shadow:0 2px 12px rgba(30,46,75,.055);--accent:#B8862E;--onenote-purple:#7719aa;--active-book-color:#7719aa}*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;font-family:'Vazirmatn',sans-serif;background:var(--paper);color:var(--ink);overscroll-behavior:none}button,input,textarea{font-family:inherit}button{cursor:pointer}

/* Loading */
#loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);flex-direction:column;gap:14px;z-index:999}
.brand-mark{width:52px;height:52px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:26px;height:26px}
#loading-screen p{color:var(--ink-soft);font-size:14px}

/* Auth & Config */
#auth-screen,#config-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--paper);z-index:900;padding:24px}
.auth-card,.config-card{width:100%;max-width:440px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:30px 28px;border:1px solid var(--paper-line)}
.auth-card h1,.config-card h1{font-size:20px;margin:0 0 10px;font-weight:700;color:var(--ink)}
.config-card p{font-size:13px;color:var(--ink-soft);line-height:1.9;margin:0 0 12px}
.config-card textarea{width:100%;min-height:130px;padding:12px;border:1px solid var(--paper-line);border-radius:8px;font-size:12.5px;font-family:monospace;background:var(--paper);color:var(--ink);resize:vertical}

/* App */
#app{display:none;height:100vh;height:100dvh;grid-template-columns:1fr;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--paper-line);background:var(--panel);z-index:20}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
#topbar .brand-mark{width:28px;height:28px;border-radius:7px}
#sync-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-inline-start:auto}
#sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);transition:background .2s}
#editor-pane{display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
#editor-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#A6A290;font-size:14px;flex-direction:column;gap:10px}
#editor-empty svg{width:40px;height:40px;opacity:.5}
#editor-content{display:none;flex-direction:column;height:100%}
#title-input{border:none;outline:none;background:transparent;font-size:24px;font-weight:700;padding:22px 24px 6px;color:var(--ink);font-family:inherit}
#body-editor{flex:1;overflow-y:auto;padding:0 24px 24px;font-size:15px;line-height:2;outline:none}
#body-editor:empty:before{content:attr(data-placeholder);color:#C9C4B2}

/* Mobile */
@media(max-width:860px){
  #main-grid{grid-template-columns:100%;position:relative}
  #notebooks-pane,#sections-pane,#notes-pane{position:fixed;top:49px;bottom:0;width:240px;z-index:20;transform:translateX(105%);transition:transform .2s ease}
  html[dir=rtl] #notebooks-pane,html[dir=rtl] #sections-pane,html[dir=rtl] #notes-pane{right:0;transform:translateX(105%)}
  #notebooks-pane.open,#sections-pane.open,#notes-pane.open{transform:translateX(0)}
  #editor-pane{grid-column:1}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#F7F4EC" stroke-width="1.6"/><path d="M8 10h8M8 14h5" stroke="#B8862E" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>
  <p>در حال بارگذاری یادنو...</p>
</div>

<div id="config-screen">
  <div class="config-card">
    <h1>اتصال به Firebase</h1>
    <p>این اپ به پروژه Firebase وصل می‌شود تا یادداشت‌ها همگام بمانند.</p>
    <textarea id="config-input" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea>
    <button id="config-save-btn" class="btn-primary">ذخیره و ادامه</button>
  </div>
</div>

<div id="auth-screen">
  <div class="auth-card">
    <h1 id="auth-title">ورود به یادنو</h1>
    <div id="auth-error" class="auth-error" style="display:none"></div>
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="auth-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="auth-password" placeholder="حداقل ۶ کاراکتر">
    </div>
    <button id="auth-submit-btn" class="btn-primary">ورود</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <button id="menu-toggle"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="logo">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#F7F4EC" stroke-width="1.6"/><path d="M8 10h8M8 14h5" stroke="#B8862E" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <span>یادنو</span>
    </div>
    <div id="sync-status"><span class="dot"></span><span id="sync-status-text">همگام</span></div>
  </div>

  <div id="main-grid">
    <div id="notebooks-pane" class="pane">
      <div class="pane-header"><span>دفترها</span></div>
      <div id="notebooks-list"></div>
    </div>
    <div id="editor-pane">
      <div id="editor-empty">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>یک یادداشت رو انتخاب کن یا یکی تازه بساز</span>
      </div>
      <div id="editor-content">
        <input id="title-input" type="text" placeholder="عنوان یادداشت">
        <div id="body-editor" contenteditable="true" data-placeholder="بنویس..."></div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== نسخه کامل بهینه‌شده (۲۳) ====================

const $ = id => document.getElementById(id);

let firebaseApp, auth, db;
let currentUser = null;
let notebooks = [], sections = [], notes = [];
let activeNotebookId = null, activeSectionId = null, activeNoteId = null;

// ==================== Firebase ====================
const CONFIG_KEY = 'yadno_firebase_config';
function getSavedConfig() { return localStorage.getItem(CONFIG_KEY); }

function initFirebase(config) {
  firebaseApp = firebase.initializeApp(config);
  auth = firebaseApp.auth();
  db = firebaseApp.firestore();
  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user) {
      document.getElementById('app').style.display = 'grid';
      startListening();
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
    }
  });
}

// ==================== Auth ====================
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  $('auth-title').textContent = mode === 'login' ? 'ورود به یادنو' : 'ساخت حساب در یادنو';
  $('auth-submit-btn').textContent = mode === 'login' ? 'ورود' : 'ثبت‌نام';
  $('auth-submit-btn').onclick = () => {
    const email = $('auth-email').value.trim();
    const pass = $('auth-password').value;
    if (mode === 'login') auth.signInWithEmailAndPassword(email, pass);
    else auth.createUserWithEmailAndPassword(email, pass);
  };
}
$('auth-submit-btn').onclick = () => setAuthMode(authMode);

// ==================== Config ====================
$('config-save-btn').onclick = () => {
  const config = JSON.parse($('config-input').value);
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  initFirebase(config);
};

// ==================== Start ====================
function boot() {
  const saved = getSavedConfig();
  if (saved) initFirebase(JSON.parse(saved));
  else document.getElementById('config-screen').style.display = 'flex';
}

boot();
</script>
</body>
</html>
