<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>یادنو — دفترچه یادداشت (نسخه کامل)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7719aa">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --paper: #faf9fc;
    --paper-line: #eae5f0;
    --ink: #32263d;
    --ink-soft: #6c6076;
    --gold: #8a3cba;
    --sage: #4eae68;
    --danger: #A83E32;
    --panel: #FFFFFF;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(29,43,79,0.06), 0 4px 16px rgba(29,43,79,0.06);
    --onenote-purple: #7719aa;
    --onenote-dark: #55117c;
    --active-book-color: #7719aa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Vazirmatn', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overscroll-behavior: none;
  }
  button, input, textarea, select { font-family: inherit; }
  button { cursor: pointer; }

  /* ---------- Loading ---------- */
  #loading-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); flex-direction: column; gap: 14px; z-index: 999;
  }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 12px; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 26px; height: 26px; }
  #loading-screen p { color: var(--ink-soft); font-size: 14px; }

  /* ---------- Auth & Config screens ---------- */
  #auth-screen, #config-screen {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--paper); z-index: 900; padding: 24px; overflow-y: auto;
  }
  .auth-card, .config-card {
    width: 100%; max-width: 410px; background: var(--panel); border-radius: 14px;
    box-shadow: var(--shadow); padding: 32px 28px; border: 1px solid var(--paper-line);
  }
  .auth-card h1, .config-card h1 { font-size: 20px; margin: 0 0 6px; color: var(--ink); font-weight: 700; }
  .auth-card .sub, .config-card p { font-size: 13px; color: var(--ink-soft); margin: 0 0 24px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .config-card textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--paper-line); border-radius: 8px;
    font-size: 14px; background: var(--paper); color: var(--ink); outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .config-card textarea:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--ink); color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 6px;
    transition: background .15s; cursor: pointer;
  }
  .btn-primary:hover { background: #14203D; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .auth-error {
    background: #FBEAE7; color: var(--danger); font-size: 12.5px; padding: 9px 12px;
    border-radius: 7px; margin-bottom: 14px; display: none; line-height: 1.6;
  }

  /* ---------- App shell ---------- */
  #app {
    display: none; height: 100vh; height: 100dvh; grid-template-columns: 1fr;
    grid-template-rows: auto 1fr; overflow: hidden;
  }
  #topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; height: 58px;
    background: linear-gradient(105deg,#64118f,#8425ae); color: #fff; z-index: 20;
  }
  #topbar button, #topbar .logo, #topbar #sync-status { color: #fff; }
  #topbar .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  #topbar .logo .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: rgba(255,255,255,0.2); }
  #topbar .logo .brand-mark svg { width: 15px; height: 15px; }
  #sync-status {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.8);
    margin-inline-start: auto; border: 1px solid rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 999px;
  }
  #sync-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); transition: background .2s; }
  #menu-toggle { display: none; background: none; border: none; padding: 6px; }
  #menu-toggle svg { width: 22px; height: 22px; }

  #main-grid {
    --nb-w: 190px; --sec-w: 190px; --notes-w: 260px;
    display: grid; grid-template-columns: var(--nb-w) 6px var(--sec-w) 6px var(--notes-w) 6px minmax(0,1fr); height: 100%; overflow: hidden; background: var(--paper-line);
  }
  .pane-resizer { cursor: col-resize; background: transparent; position: relative; z-index: 5; touch-action: none; }
  .pane { overflow-y: auto; background: var(--panel); }
  #notebooks-pane { padding: 14px 10px; }
  #sections-pane { background: #fdfbff; padding: 12px 10px; }
  #notes-pane { padding: 12px 10px; }
  
  .pane-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 10px; font-size: 12px; color: var(--ink-soft); font-weight: 600;
  }
  .icon-btn {
    background: none; border: none; color: var(--ink-soft); padding: 4px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--paper-line); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }

  .notebook-item, .note-item {
    border-radius: 9px; padding: 9px 10px; cursor: pointer; margin-bottom: 3px;
    transition: background .16s; position: relative;
  }
  .notebook-item:hover, .note-item:hover { background: var(--paper-line); }
  .notebook-item.active, .note-item.active { background: color-mix(in srgb, var(--active-book-color) 12%, white); color: var(--ink); font-weight: 600; }

  #editor-pane { display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }
  #editor-empty {
    flex: 1; display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
    font-size: 14px; flex-direction: column; gap: 10px;
  }
  #editor-content { display: none; flex-direction: column; height: 100%; max-width: 1000px; width: 100%; margin: auto; padding: 24px 34px 70px; }
  
  #editor-toolbar {
    display: flex; gap: 4px; padding: 8px; border: 1px solid var(--paper-line);
    background: var(--panel); align-items: center; border-radius: 12px; margin-bottom: 10px; flex-wrap: wrap;
  }
  #editor-toolbar button, #editor-toolbar select {
    background: none; border: none; padding: 7px 10px; border-radius: 6px; font-size: 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  #editor-toolbar button:hover { background: var(--paper-line); color: var(--ink); }
  
  #title-input {
    border: none; outline: none; background: transparent; font-size: 24px; font-weight: 700;
    padding: 12px 4px; color: var(--ink); border-bottom: 2px solid var(--active-book-color);
  }
  #body-editor {
    flex: 1; overflow-y: auto; padding: 18px 4px; font-size: 16px; line-height: 2;
    outline: none; border: none;
  }
  #body-editor h3 { font-size: 18px; margin: 12px 0 6px; }

  /* ---------- Responsive Design ---------- */
  @media (max-width: 860px) {
    .pane-resizer { display: none; }
    #menu-toggle { display: flex; }
    #main-grid { grid-template-columns: 100%; position: relative; }
    #notebooks-pane, #sections-pane, #notes-pane {
      position: fixed; top: 58px; bottom: 0; width: 260px; z-index: 50;
      transform: translateX(110%); transition: transform .2s ease; right: 0;
    }
    #notebooks-pane.open, #sections-pane.open, #notes-pane.open { transform: translateX(0); }
    #mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; }
    #mobile-overlay.show { display: block; }
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#F7F4EC" stroke-width="1.6"/><path d="M8 10h8M8 14h5" stroke="#B8862E" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>
  <p>در حال بارگذاری یادنو...</p>
</div>

<!-- تنظیمات فایربیس -->
<div id="config-screen">
  <div class="config-card">
    <h1>اتصال به Firebase</h1>
    <p>اطلاعات پیکربندی فایربیس خود را وارد کنید.</p>
    <textarea id="config-input" placeholder='{"apiKey": "...", "projectId": "..."}'></textarea>
    <div class="auth-error" id="config-error"></div>
    <button class="btn-primary" id="config-save-btn">ذخیره و ادامه</button>
  </div>
</div>

<!-- صفحه ورود -->
<div id="auth-screen">
  <div class="auth-card">
    <h1 id="auth-title">ورود به یادنو</h1>
    <p class="sub">با حساب کاربری خود وارد شوید.</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="field"><label>ایمیل</label><input type="email" id="auth-email"></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="auth-password"></div>
    <button class="btn-primary" id="auth-submit-btn">ورود</button>
  </div>
</div>

<!-- اپلیکیشن اصلی -->
<div id="app">
  <div id="topbar">
    <button id="menu-toggle" aria-label="منو">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="logo">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#F7F4EC" stroke-width="1.6"/><path d="M8 10h8M8 14h5" stroke="#B8862E" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <span>یادنو</span>
    </div>
    <div id="sync-status"><span class="dot"></span><span id="sync-status-text">همگام</span></div>
  </div>

  <div id="main-grid">
    <div id="notebooks-pane" class="pane">
      <div class="pane-header"><span>دفترها</span><button class="icon-btn" id="add-notebook-btn">＋</button></div>
      <div id="notebooks-list"></div>
    </div>
    <div class="pane-resizer" data-before="notebooks-pane" data-css="--nb-w"></div>

    <div id="sections-pane" class="pane">
      <div class="pane-header"><span id="sections-pane-title">بخش‌ها</span><button class="icon-btn" id="add-section-btn">＋</button></div>
      <div id="sections-list"></div>
    </div>
    <div class="pane-resizer" data-before="sections-pane" data-css="--sec-w"></div>

    <div id="notes-pane" class="pane">
      <div class="pane-header"><span id="notes-pane-title">یادداشت‌ها</span><button class="icon-btn" id="add-note-btn">＋</button></div>
      <div id="notes-list"></div>
    </div>
    <div class="pane-resizer" data-before="notes-pane" data-css="--notes-w"></div>

    <div id="editor-pane">
      <div id="editor-empty"><span>یک یادداشت را انتخاب کنید</span></div>
      <div id="editor-content">
        <div id="editor-toolbar">
          <button data-cmd="bold"><b>B</b></button>
          <button data-cmd="italic"><i>I</i></button>
          <button data-cmd="underline"><u>U</u></button>
        </div>
        <input id="title-input" type="text" placeholder="عنوان یادداشت">
        <div id="body-editor" contenteditable="true" data-placeholder="بنویسید..."></div>
      </div>
    </div>
  </div>
  <div id="mobile-overlay"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  function showScreen(name) {
    $('loading-screen').style.display = name === 'loading' ? 'flex' : 'none';
    $('config-screen').style.display = name === 'config' ? 'flex' : 'none';
    $('auth-screen').style.display = name === 'auth' ? 'flex' : 'none';
    $('app').style.display = name === 'app' ? 'grid' : 'none';
  }
  
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('yadno_firebase_config');
    if (saved) {
      showScreen('auth');
    } else {
      showScreen('config');
    }
  });

  $('config-save-btn')?.addEventListener('click', () => {
    try {
      const val = JSON.parse($('config-input').value);
      if(val.apiKey) {
        localStorage.setItem('yadno_firebase_config', JSON.stringify(val));
        showScreen('auth');
      }
    } catch(e) {
      $('config-error').textContent = 'فرمت JSON نامعتبر است.';
      $('config-error').style.display = 'block';
    }
  });

  function openMobilePane(which) {
    $('notebooks-pane')?.classList.toggle('open', which === 'notebooks');
    $('sections-pane')?.classList.toggle('open', which === 'sections');
    $('notes-pane')?.classList.toggle('open', which === 'notes');
    $('mobile-overlay')?.classList.toggle('show', !!which);
  }
  $('menu-toggle')?.addEventListener('click', () => openMobilePane('notebooks'));
  $('mobile-overlay')?.addEventListener('click', () => openMobilePane(null));
</script>
</body>
</html>
